<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="icon/japanese-kanji-svgrepo-com.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <style>html{background:#f7f3ec;color-scheme:light}</style>
    <meta name="referrer" content="origin" />
    <title>Kanji App</title>

    <!--
      Boot guard. A crash while the module graph is evaluating (e.g. a bad
      config throwing at import time) happens BEFORE React exists, so no
      ErrorBoundary can catch it. Only a classic, non-module script registered
      ahead of the module tag can. Keep this dependency-free and inline.
    -->
    <script>
      (function () {
        // Allowlist, not a denylist: localhost, LAN IPs, `vercel dev` and preview
        // deployments must keep their real stack trace and Vite's error overlay.
        // Add any new production hostname here or the guard silently does nothing.
        // 'kanjapp-ts-vineyardcode.vercel.app' used to be listed here and was
        // dead weight: it serves a frozen build of the error page, not the app.
        // Per-deployment URLs (kanjapp-<hash>-...) never match, by design.
        var PROD_HOSTS = [
          'kanjapp-ts-vineyardcodes-projects.vercel.app'
        ];
        var ERROR_PAGE = 'https://error-page-ten.vercel.app/';

        if (PROD_HOSTS.indexOf(location.hostname) === -1) return;

        var fired = false;

        // Supabase magic-link returns tokens in the URL fragment (implicit flow).
        // Never navigate away mid-exchange or the login is silently destroyed.
        function midAuth() {
          return /[#&](access_token|refresh_token|provider_token)=/.test(location.hash) ||
                 /[?&]code=/.test(location.search);
        }

        function mounted() {
          var r = document.getElementById('root');
          return !r || r.childElementCount > 0;
        }

        // `force` is for the backstops only. midAuth() protects a login that is
        // actually in flight, but it is sticky: only supabase-js clears the
        // fragment, and on a broken deploy supabase-js never loads. It would
        // otherwise stay true for the life of the page and suppress the
        // redirect, the backstop AND the fallback paint below - a permanently
        // blank screen for magic-link arrivals, the one group that cannot
        // simply reload. After the backstop has elapsed with #root still empty
        // there is demonstrably no app left to finish the exchange, and the
        // token is discarded either way (the URL below is built from scratch).
        function fail(code, force) {
          if (fired || mounted()) return;
          if (midAuth() && !force) return;
          fired = true;

          // Paint a readable fallback FIRST. The error page is itself a heavy
          // WebGL app, so it can fail for the very reason we are leaving (no
          // WebGL, or the network fault that killed this bundle).
          var r = document.getElementById('root');
          if (r) {
            r.innerHTML =
              '<main style="font:16px/1.6 system-ui,sans-serif;color:#eee;background:#111;' +
              'padding:2rem;min-height:100vh;box-sizing:border-box">' +
              '<h1>Kanji App did not load</h1>' +
              '<p>Your saved kanji are still stored on this device.</p>' +
              '<p><a style="color:#8cf" href="' + ERROR_PAGE + '">More info</a></p>' +
              '</main>';
          }

          // Build the URL from scratch — never forward location.href, the hash,
          // the query, or a raw stack: any of those can carry session tokens.
          // replace() so Back cannot bounce the user into the broken page.
          location.replace(
            ERROR_PAGE + '?code=' + code +
            '&message=' + encodeURIComponent('The app failed to start. Please try again later.')
          );
        }

        // Capture phase is required: a failed <script> resource fires an error
        // event at the element and does NOT bubble to window.
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target !== window && e.target.tagName === 'SCRIPT') {
            fail(503);
            return;
          }
          fail(500);
        }, true);

        // A rejected promise never fires an 'error' event, so a failed dynamic
        // import() or a rejected top-level await used to fall through to the
        // 20s backstop - a blank screen for 20s before the redirect. Same 500
        // as a synchronous throw: in both cases the app threw while starting.
        // fail()'s mounted() check still protects an app that came up fine, so
        // a rejection from ordinary use after boot cannot evict anyone.
        window.addEventListener('unhandledrejection', function () {
          fail(500);
        });

        // Long backstop only. The bundle is ~900 KB gzipped; a short timer would
        // evict perfectly healthy users on slow connections.
        window.addEventListener('load', function () {
          setTimeout(function () { fail(504, true); }, 20000);
        });

        // ...and an absolute one, because 'load' does not fire while a request
        // is still outstanding. A bundle request that hangs rather than failing
        // (dead origin holding the connection open) leaves readyState at
        // 'loading' indefinitely, so the timer above is never even scheduled -
        // the exact scenario the backstop exists for. Measured from parse, so
        // it must be slack enough not to evict a slow but healthy load.
        setTimeout(function () { fail(504, true); }, 45000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
